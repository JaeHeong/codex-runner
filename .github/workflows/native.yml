name: Native tests and packages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -q
      - name: Install pinned Codex for auth-free IPC test
        run: npm install -g @openai/codex@0.163.0
      - name: Native shared daemon IPC
        run: python scripts/smoke_native.py
      - name: Build standalone command
        run: python -m PyInstaller --clean --noconfirm --onefile --name codex-runner --collect-all codex_runner --collect-all curses packaging/native_entry.py
      - name: Check standalone command
        shell: bash
        run: |
          ./dist/codex-runner --version
          ./dist/codex-runner --help
      - name: Collect licenses and native artifact
        run: python scripts/package_native.py --platform ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-runner-${{ matrix.artifact }}
          path: native-dist/*
