name: Native tests and packages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install '.[discord]' pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -q
      - name: Install pinned Codex for auth-free IPC test
        run: npm install -g @openai/codex@0.163.0
      - name: Native shared daemon IPC
        if: runner.os != 'Windows'
        run: python scripts/smoke_native.py
      - name: Native Windows socket IPC under a non-administrator login
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString (([guid]::NewGuid().ToString()) + '!Aa1') -AsPlainText -Force
          New-LocalUser -Name CodexRunnerTest -Password $password | Out-Null
          $credential = [pscredential]::new("$env:COMPUTERNAME\CodexRunnerTest", $password)
          $env:CODEX_RUNNER_TEST_TMP = 'C:\Windows\Temp'
          $python = (Get-Command python).Source
          $script = (Resolve-Path scripts/smoke_native.py).Path
          $out = Join-Path $env:RUNNER_TEMP 'native-ipc.stdout'
          $err = Join-Path $env:RUNNER_TEMP 'native-ipc.stderr'
          $process = Start-Process -FilePath $python -ArgumentList "`"$script`"" -Credential $credential -LoadUserProfile -WorkingDirectory 'C:\Windows\Temp' -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          Get-Content $out
          Get-Content $err
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Build standalone command
        run: python -m PyInstaller --clean --noconfirm --onefile --name codex-runner --collect-all codex_runner --collect-all curses --collect-all discord --collect-all aiohttp packaging/native_entry.py
      - name: Check standalone command
        shell: bash
        run: |
          ./dist/codex-runner --version
          ./dist/codex-runner --help
      - name: Collect licenses and native artifact
        run: python scripts/package_native.py --platform ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-runner-${{ matrix.artifact }}
          path: native-dist/*
